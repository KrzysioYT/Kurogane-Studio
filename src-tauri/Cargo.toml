[package]
name = "kurogane-studio"
version = "0.7.0"
description = "Kurogane Studio — desktopowy edytor zasobów 3D"
authors = ["KrzysioYT"]
license = "UNLICENSED"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "kurogane_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rfd = "0.15"
rpf-archive = "0.10"
rage-formats = "0.5.0"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
