name: Windows build
on:
  push:
    branches: [main, feat/windows-3d-editor-mvp, feat/fivem-vehicle-addon-builder, feat/rpf-to-fivem, feat/zip-addon-project-editor, feat/native-ytd-livery-workbench, feat/yft-3d-inspector, feat/uv-livery-preview, feat/vertex-modeler]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Node dependencies
        run: npm install --no-audit --no-fund
      - name: Test resource generator
        run: npm test
      - name: Typecheck and build UI
        run: npm run build
      - name: Test native RPF7 extraction (Rust)
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build Windows NSIS installer
        run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: kurogane-studio-windows-nsis
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
